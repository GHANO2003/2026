name: ProMonitor 360 - Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. نقل ملفات المشروع للمجلد الرئيسي إذا رُفعت داخل مجلد فرعي
      - name: Locate and align Project Files to Root
        run: |
          SETTINGS_PATH=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -n "$SETTINGS_PATH" ]; then
            SUBDIR=$(dirname "$SETTINGS_PATH")
            if [ "$SUBDIR" != "." ]; then
              echo "Found Gradle project in subfolder: $SUBDIR. Moving files to root..."
              cp -rn "$SUBDIR"/* . || true
              cp -rn "$SUBDIR"/.[!.]* . 2>/dev/null || true
            fi
          fi

      # 2. تهيئة بيئة Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إنشاء وتجهيز ملفات البيئة والمفاتيح (.env و debug.keystore)
      - name: Prepare Keystores and Environment Files
        run: |
          # Ensure .env and .env.example exist so Secrets Gradle Plugin succeeds
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'AIzaSyDummyKeyForBuild' }}" > .env
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'AIzaSyDummyKeyForBuild' }}" > .env.example
            fi
          fi

          # Decode Release Keystore if provided in GitHub Secrets
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          fi

          # Ensure debug.keystore exists in root for AI Studio signingConfigs
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 4. استعادة وإصلاح ملفات Gradle Wrapper تلقائياً في حال فقدانها
      - name: Auto-Restore Gradle Wrapper if missing
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "networkTimeout=60000" >> gradle/wrapper/gradle-wrapper.properties
            echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          if [ ! -f gradlew ]; then
            echo "Downloading gradlew..."
            curl -sLo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradlew
          fi
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # 5. إعداد Android SDK وقبول التراخيص
      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v4

      - name: Ensure Android SDK licenses accepted
        run: |
          yes | sdkmanager --licenses || true

      # 6. إعداد Gradle Caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 7. تشغيل اختبارات الوحدة (Unit & Robolectric Tests)
      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace || echo "Tests finished with warnings or issues"

      # 8. بناء حزمة التطبيق Debug APK
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # 9. محاولة بناء حزمة Release APK إن وُجدت مفاتيح التوقيع
      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH || 'my-upload-key.jks' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f my-upload-key.jks ] || [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
            ./gradlew :app:assembleRelease --no-daemon || echo "assembleRelease failed, relying on Debug APK"
          else
            echo "Skipping Release signing build (no upload keystore configured)"
          fi

      # 10. رفع ملفات الـ APK كـ Artifact قابل للتحميل المباشر
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProMonitor360-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # 11. إنشاء GitHub Release تلقائي عند إنشاء Tag جديد (مثل v1.0.0)
      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
